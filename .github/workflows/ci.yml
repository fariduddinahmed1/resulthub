name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Run server tests
        run: npm test
        working-directory: ./server
        env:
          JWT_SECRET: ci-secret-key-for-testing-only

  lint-client:
    name: Lint Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: Lint client
        run: npm run lint
        working-directory: ./client

      - name: Build client
        run: npm run build
        working-directory: ./client
